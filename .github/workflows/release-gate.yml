name: Commercial Release Gate

on:
  workflow_dispatch:
    inputs:
      verify_isolated_portal:
        description: Verify temporary synthetic Auth customers on the isolated Preview and clean them up
        required: false
        default: false
        type: boolean
      provider_recovery_run_id:
        description: Optional UUID of a previously journaled isolated test run to clean up
        required: false
        default: ''
        type: string
      stage_candidate:
        description: Build a staged Production candidate without assigning live domains (does not qualify or promote it)
        required: false
        default: false
        type: boolean
      authenticated_candidate:
        description: Use authenticated Vercel transport for a protected immutable candidate (all smoke assertions remain enabled)
        required: false
        default: false
        type: boolean
      candidate_url:
        description: HTTPS origin serving the release candidate
        required: true
        type: string
      candidate_commit:
        description: Source commit deployed at the candidate origin
        required: true
        type: string
      release_fingerprint:
        description: Public release fingerprint reported by /api/health
        required: true
        type: string
      evidence_file:
        description: Committed launch-evidence manifest
        required: true
        default: docs/launch-evidence.json
        type: string
      launch_stage:
        description: Release stage to qualify
        required: true
        default: stage-one
        type: choice
        options:
          - stage-one
          - commerce

jobs:
  isolated-provider-verification:
    if: ${{ inputs.verify_isolated_portal }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: isolated-provider-verification
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      MONITORING_TEST_SECRET: ${{ secrets.MONITORING_TEST_SECRET }}
      PROVIDER_DEPLOYMENT_URL: ${{ inputs.candidate_url }}
      PROVIDER_SOURCE_COMMIT: ${{ inputs.candidate_commit }}
      PROVIDER_ACKNOWLEDGE_TEMPORARY_USERS: 'true'
      PROVIDER_RECOVERY_RUN_ID: ${{ inputs.provider_recovery_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate exact isolated deployment and verify providers
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_N2ebrhHRUamJXfQQ2LXBOEny","projectId":"prj_ivs19EGdAuvKZJ6nPd34WRtJ3Kki"}' > .vercel/project.json
          node react-app/scripts/verify-isolated-provider.js
      - name: Retain sanitized provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-provider-verification
          path: |
            isolated-provider-verification.json
            isolated-provider-run.json
          if-no-files-found: ignore

  stage-candidate:
    if: ${{ inputs.stage_candidate && !inputs.verify_isolated_portal }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Link existing project
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_N2ebrhHRUamJXfQQ2LXBOEny","projectId":"prj_ivs19EGdAuvKZJ6nPd34WRtJ3Kki"}' > .vercel/project.json
      - name: Build without assigning live domains
        id: deploy
        run: |
          npx --yes vercel@59.3.0 deploy --prod --skip-domain --yes \
            --build-env VITE_COMMERCE_ENABLED=false \
            --env COMMERCE_ENABLED=false --env STAFF_PORTAL_ENABLED=false \
            --env RELEASE_SOURCE_COMMIT="$GITHUB_SHA" \
            --env RELEASE_FINGERPRINT="softhe-${GITHUB_SHA:0:7}-stage1" \
            --meta githubCommitSha="$GITHUB_SHA" --meta githubCommitRef="$GITHUB_REF_NAME" > candidate-url.txt
          candidate_url=$(tail -n 1 candidate-url.txt)
          case "$candidate_url" in https://*.vercel.app) ;; *) echo 'Invalid candidate URL'; exit 1;; esac
          echo "url=$candidate_url" >> "$GITHUB_OUTPUT"
          printf 'Staged candidate: %s\nSource: %s\nLive domain assignment was skipped.\n' "$candidate_url" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Inspect staged runtime configuration
        env:
          CANDIDATE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          npx --yes vercel@59.3.0 curl /api/health --deployment "$CANDIDATE_URL" -- --silent --show-error --max-time 30 > candidate-health.json
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('candidate-health.json','utf8'));console.log(JSON.stringify(h));if(h.status!=='ready'||!Object.values(h.checks||{}).every(Boolean))throw Error('Staged candidate configuration is not ready');if(h.release?.sourceCommit!==process.env.GITHUB_SHA)throw Error('Staged candidate source identity mismatch');if(h.release?.fingerprint!=='softhe-'+process.env.GITHUB_SHA.slice(0,7)+'-stage1')throw Error('Staged candidate release fingerprint mismatch')"
      - name: Strict staged production smoke
        working-directory: react-app
        env:
          PRODUCTION_BASE_URL: ${{ steps.deploy.outputs.url }}
          SMOKE_VERCEL_AUTH: 'true'
          REQUIRE_APP_MARKER: 'true'
          REQUIRE_SECURITY_HEADERS: 'true'
          REQUIRE_SERVERLESS_API: 'true'
        run: |
          EXPECTED_RELEASE_SOURCE_COMMIT="$GITHUB_SHA" EXPECTED_RELEASE_FINGERPRINT="softhe-${GITHUB_SHA:0:7}-stage1" node scripts/production-smoke.js

  release-gate:
    if: ${{ !inputs.stage_candidate && !inputs.verify_isolated_portal }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: react-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify committed launch evidence
        run: npm run evidence:verify
        env:
          LAUNCH_EVIDENCE_FILE: ../${{ inputs.evidence_file }}
          EVIDENCE_EXPECTED_ORIGIN: ${{ inputs.candidate_url }}
          EVIDENCE_EXPECTED_COMMIT: ${{ inputs.candidate_commit }}
          EVIDENCE_EXPECTED_RELEASE_FINGERPRINT: ${{ inputs.release_fingerprint }}
          LAUNCH_STAGE: ${{ inputs.launch_stage }}

      - name: Run strict production smoke
        run: npm run smoke:production
        env:
          PRODUCTION_BASE_URL: ${{ inputs.candidate_url }}
          SMOKE_VERCEL_AUTH: ${{ inputs.authenticated_candidate && 'true' || 'false' }}
          REQUIRE_APP_MARKER: 'true'
          REQUIRE_SECURITY_HEADERS: 'true'
          REQUIRE_SERVERLESS_API: 'true'
          EXPECTED_RELEASE_SOURCE_COMMIT: ${{ inputs.candidate_commit }}
          EXPECTED_RELEASE_FINGERPRINT: ${{ inputs.release_fingerprint }}
