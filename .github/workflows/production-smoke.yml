name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check production
        run: node scripts/production-smoke.js
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://softhe.io' }}
          REQUIRE_APP_MARKER: ${{ vars.REQUIRE_APP_MARKER || 'false' }}
          REQUIRE_SECURITY_HEADERS: ${{ vars.REQUIRE_SECURITY_HEADERS || 'false' }}
          REQUIRE_SERVERLESS_API: ${{ vars.REQUIRE_SERVERLESS_API || 'false' }}
          EXPECTED_RELEASE_SOURCE_COMMIT: ${{ vars.EXPECTED_RELEASE_SOURCE_COMMIT }}
          EXPECTED_RELEASE_FINGERPRINT: ${{ vars.EXPECTED_RELEASE_FINGERPRINT }}
