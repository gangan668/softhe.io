name: Main Branch Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: react-app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage -- --run

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Strict builds and browser tests
        run: npm run e2e:all

      - name: Asset performance budget
        run: npm run budget

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-evidence
          path: |
            react-app/playwright-report/
            react-app/test-results/
          if-no-files-found: ignore
          retention-days: 14
