version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /react-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-patch-updates:
        dependency-type: development
        update-types:
          - patch
